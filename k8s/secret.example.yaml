# 데이터베이스 접속 문자열을 담는 Secret의 **예시**다. 값은 비어 있다.
#
# 쓰는 법: 이 파일을 `k8s/secret.yaml`로 복사해 아래 값을 채운 뒤 적용한다.
#
#     cp k8s/secret.example.yaml k8s/secret.yaml
#     # k8s/secret.yaml을 열어 DATABASE_URL 값을 채운다
#     kubectl apply -f k8s/secret.yaml
#
# `k8s/secret.yaml`은 `.gitignore`와 `.dockerignore` 양쪽에 걸려 있어 커밋되지도,
# 이미지 빌드 컨텍스트에 실리지도 않는다.
#
# **이 파일을 그대로 적용하지 마라.** 값이 비어 있어서 부팅이 실패한다.
# **실제 접속 문자열을 이 파일에 적어 넣지도 마라.** 이 파일은 추적 대상이다.
#
# 배포 절차 전체(이 단계의 다른 방법 포함)는 한 곳에만 둔다 —
# `docs/k8s-local-verification.md`의 2단계다. 절차를 여기에도 적어 두면 두 사본이
# 갈라지고, 실제로 한 번 갈라졌다.
apiVersion: v1
kind: Secret
metadata:
  name: grownup-todo-backend-env
  namespace: grownup-todo
type: Opaque
# `data`가 아니라 `stringData`를 쓴다 — base64 인코딩 없이 평문으로 적을 수
# 있어서, 값을 잘못 옮겨 적는 실수가 줄어든다.
stringData:
  # Supabase 트랜잭션 모드 풀러(포트 6543)의 접속 문자열.
  # 예: postgresql://postgres.<프로젝트>:<비밀번호>@<호스트>:6543/postgres
  #
  # `.env`에서 값을 옮겨 올 때 **값을 감싼 큰따옴표는 빼고 내용만 넣는다.**
  # 따옴표가 값에 섞이면 접속 문자열 검증에 걸려 부팅이 실패하고, 로그에는
  # `환경변수 DATABASE_URL이 postgres 접속 문자열이 아니다`만 남는다.
  DATABASE_URL: ''
