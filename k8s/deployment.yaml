# 애플리케이션 배포 정의.
#
# 이 파일이 지키려는 것은 **재배포 중에 실패하는 요청이 0건**인 것이다.
# 그러려면 세 가지가 동시에 맞아야 하고, 하나만 빠져도 조용히 깨진다.
#   1. 새 파드가 준비되기 전에 옛 파드를 내리지 않는다 (maxUnavailable: 0)
#   2. 옛 파드가 요청을 그만 받게 된 사실이 부하 분산 대상 목록에 퍼질 동안에도
#      옛 파드가 요청을 계속 받는다 (애플리케이션의 드레인 국면 =
#      SHUTDOWN_DRAIN_DELAY_MS. 아래 "종료 절차" 주석)
#   3. 옛 파드의 프로세스가 처리 중 요청을 끝내고 자원을 해제할 시간을 준다
#      (terminationGracePeriodSeconds + 애플리케이션의 정상 종료 구현)
#
# ---------------------------------------------------------------------------
# 종료 절차 — 이 파일에서 가장 조용히 깨지는 부분이다
# ---------------------------------------------------------------------------
# 파드를 지울 때 쿠버네티스는 두 가지를 **동시에** 시작한다. 컨테이너에 SIGTERM을
# 보내는 것과, 이 파드를 전달 대상 목록(EndpointSlice)에서 빼고 그 사실을 각
# 노드의 kube-proxy로 퍼뜨리는 것이다. 둘 사이에 순서 보장이 없어서, 전파가
# 끝나기 전에 프로세스가 리슨 소켓을 닫으면 그 사이에 도착한 요청이 연결 거부로
# 죽는다.
#
# 그 창을 덮는 것이 애플리케이션의 드레인 국면이다. SIGTERM을 받으면
#   ① 종료 플래그를 세워 준비 확인(/api/v1/ready)을 즉시 503으로 바꾸고
#   ② SHUTDOWN_DRAIN_DELAY_MS만큼 HTTP 서버를 **열어 둔 채** 기다린 뒤
#   ③ HTTP 서버를 닫아 처리 중 요청의 완료를 기다리고
#   ④ 자원(Postgres 커넥션 풀)을 해제한다
# 구현은 `src/shutdown/shutdown-registry.service.ts`에 있다.
#
# **`preStop` 훅을 두지 않는다.** 같은 창을 덮는 두 가지 방법이라 함께 두면 대기가
# 이중으로 쌓여 유예 시간 예산만 먹는다. 남길 쪽으로 드레인 국면을 택한 이유는
# 그것이 기다리는 동안 준비 확인을 503으로 바꾸기까지 하기 때문이다 —
# `preStop: sleep`은 아무 신호도 보내지 않고 기다리기만 한다. 대기를 매니페스트 쪽으로
# 되돌리려면 `preStop`을 넣는 것만으로는 안 되고 SHUTDOWN_DRAIN_DELAY_MS를 0으로 함께
# 내려야 한다.
#
# 그 503이 어느 종료 경로에서 무엇을 하는지는 `docs/k8s-local-verification.md`의
# **① 절**(경로별 표와 실측 여섯 건)과 **②-2 절**(엔드포인트를 빼는 것은 준비 확인이
# 아니라 삭제 표식이라는 실측)에 나뉘어 있다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grownup-todo-backend
  namespace: grownup-todo
  labels:
    app.kubernetes.io/name: grownup-todo-backend
spec:
  # 사용자 확정 사항 — 검증 환경이므로 파드 하나로 시작한다. 아래 갱신 전략이
  # `maxUnavailable: 0`이라, 하나여도 재배포 중에 요청을 받을 파드가 항상
  # 최소 하나는 살아 있다.
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드가 준비 확인(readiness)을 통과한 **뒤에** 옛 파드를 내린다.
      # 기본값 25%는 파드가 하나일 때 1로 올림되어, 옛 파드를 먼저 죽이고
      # 새 파드를 띄우는 순서가 된다 — 그 사이 모든 요청이 실패한다.
      maxUnavailable: 0
      # 그래서 잠시 파드가 둘이 되는 것을 허용해야 한다. 이 값이 0이면
      # maxUnavailable 0과 맞물려 배포가 영원히 진행되지 않는다.
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: grownup-todo-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: grownup-todo-backend
    spec:
      # 종료 유예 시간. 이 시간이 지나면 쿠버네티스가 SIGKILL로 강제 종료한다
      # — 정상 종료의 최종 방어선이다. 예산을 더해서 정한다.
      #
      #   드레인 대기            8초  (아래 SHUTDOWN_DRAIN_DELAY_MS)
      #   처리 중 요청 완료 대기  0초에 가깝다 — 이 서비스의 요청은 밀리초
      #                          단위이고, 드레인 8초 동안 이미 대부분 끝난다
      #   자원 해제 상한        10초  (`src/shutdown/shutdown-registry.service.ts`
      #                          의 DISPOSE_TIMEOUT_MS. 자원 하나당 상한이고
      #                          지금 등록된 자원은 Postgres 커넥션 풀 하나다)
      #   ------------------------------
      #   합                    18초  → 여유 12초를 더해 30초
      #
      # 여유 12초가 덮는 것은 느린 요청 하나가 HTTP close를 붙잡는 경우다 —
      # 그때 SIGKILL로 넘어가면 자원 해제가 통째로 건너뛰어져 Supabase 풀러 쪽에
      # 커넥션이 남는다. **드레인 대기를 늘리면 이 값도 함께 올려야 한다.**
      #
      # 실측(2026-08-17): 파드 삭제부터 자원 해제 완료까지 8.1초. 유예 30초의
      # 4분의 1을 쓴다.
      terminationGracePeriodSeconds: 30

      # 쿠버네티스 API용 서비스 계정 토큰을 마운트하지 않는다.
      #
      # **이 애플리케이션은 쿠버네티스 API를 부르지 않는다** — 저장소에 클라이언트도
      # 참조도 없다. 그런데 기본값은 토큰을 컨테이너 안에 넣으므로, 아래에서 루트
      # 파일시스템을 읽기 전용으로 걸고 능력을 전부 떨어뜨려도 **쓰이지 않는 자격
      # 증명 하나만 그 안에 살아 있게** 된다. 다른 방어선과 급을 맞추는 한 줄이다.
      #
      # "지금 이 클러스터에서는 그 토큰으로 할 수 있는 것이 거의 없다"는 것은
      # 클러스터의 접근 제어 설정에 달린 사실이라 배포 대상이 바뀌면 함께 바뀐다 —
      # 파드 명세가 스스로 보장할 수 있는 쪽을 택했다. 쿠버네티스 API를 불러야 하는
      # 요구가 생기면 이 줄을 지우게 되고, 그때는 이 파일을 열게 되므로 눈에 띈다.
      #
      # 이 줄을 넣은 파드를 실제로 띄워 정상 기동(1/1 Running, 재시작 0)을 확인했다
      # (2026-08-17) — 앱이 토큰을 쓰지 않으므로 기동 경로에 영향이 없다.
      automountServiceAccountToken: false

      securityContext:
        # 컨테이너 이미지가 `USER node`로 루트를 벗어났는지 쿠버네티스 쪽에서
        # 한 번 더 강제한다. 이미지가 바뀌어 루트로 돌아가면 파드가 아예
        # 뜨지 않으므로, 조용히 권한이 올라가는 일이 없다.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: server

          # 레지스트리에 올리지 않고 로컬에서 빌드한 이미지를 그대로 쓴다.
          image: grownup-todo-backend:local

          # 가져오기 정책이 `Always`인데도 레지스트리 없이 동작한다. Docker
          # Desktop의 쿠버네티스가 호스트의 이미지 저장소를 그대로 참조해
          # 주기 때문이다(이 저장소에서 실측). **다른 클러스터에 이 파일을
          # 그대로 쓰면 안 되는 유일한 줄이다** — 진짜 레지스트리를 쓰는
          # 환경에서는 존재하지 않는 이미지를 찾다가 ErrImagePull이 된다.
          #
          # `IfNotPresent`(태그가 `latest`가 아닐 때의 기본값)로 두면 안 되는
          # 이유가 있다. 코드를 고쳐 **같은 태그로** 이미지를 다시 만들어도
          # 노드는 이미 그 태그를 가지고 있다고 판단해 다시 가져오지 않는다.
          # 그러면 파드만 새로 뜨고 내용은 옛 이미지 그대로인데, 어디에도
          # 오류가 나지 않아 "고친 것이 반영되지 않는다"는 증상만 남는다
          # (실측 — 고친 이미지를 다시 만들었는데 파드가 같은 오류로 계속
          # 죽었다).
          imagePullPolicy: Always

          ports:
            # 이름을 붙인다. 아래 프로브들과 Service가 숫자 대신 이 이름을
            # 가리키므로, 매니페스트 안에서 포트 숫자가 사는 곳은 이 값과
            # 아래 PORT 환경변수 둘뿐이고 둘은 같아야 한다. 그 일치는
            # `src/config/deployment-port.spec.ts`가 고정한다.
            - name: http
              containerPort: 4080

          env:
            # 애플리케이션이 들을 포트. 민감값이 아니라 Secret이나 ConfigMap을
            # 따로 두지 않고 여기 직접 적는다 — 반드시 같아야 하는 짝인
            # containerPort 바로 옆에 있어야 눈으로도 대조가 되고, 파일과
            # 참조를 하나 더 늘리면 오히려 어긋날 자리가 늘어난다.
            - name: PORT
              value: '4080'

            # 드레인 대기(밀리초). 기본값(5000)에 맡기지 않고 여기 명시하는 이유는
            # 이 값이 **아래 준비 확인 프로브 값과 짝**이기 때문이다. 준비 확인이
            # 실패로 판정되기까지 걸리는 시간보다 이 대기가 충분히 길어야 파드가
            # 트래픽 경로에서 빠진 뒤에 HTTP 서버가 닫힌다. 짝이 어긋나도 오류는
            # 나지 않으므로(배출만 조용히 사라진다) 두 값이 같은 파일 안에서 눈으로
            # 대조돼야 하고, 그 대조를 `src/health/deployment-probe.spec.ts`가
            # 테스트로도 고정한다.
            #
            #   준비 확인 최악 판정 시간 (1초 + 1초) × 2회 = 4초
            #   전파 여유                                 2초
            #   ------------------------------------------------
            #   필요한 최소 대기                          6초 → 8초로 둔다
            #
            # 값의 형식·범위 검증은 `src/config/env.validation.ts`가 한다(0~60000).
            - name: SHUTDOWN_DRAIN_DELAY_MS
              value: '8000'

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # 이 Secret은 저장소에 없다 — 접속 문자열을 커밋하지 않기
                  # 때문이다. 만드는 절차는 `docs/k8s-local-verification.md`의
                  # 2단계 한 곳에만 있다. 형태만 보려면
                  # `k8s/secret.example.yaml`을 열어 보면 된다.
                  name: grownup-todo-backend-env
                  key: DATABASE_URL

          # ---------------------------------------------------------------
          # 프로브 배선 — 이 세 줄은 규칙이다. 바꾸지 마라
          #   생존 확인 → /api/v1/ping    (종료 중에도 200)
          #   기동 확인 → /api/v1/ping
          #   준비 확인 → /api/v1/ready   (종료가 시작되면 503)
          #
          # **왜 이래야 하는지와 어긋났을 때 무엇을 잃는지는 한 곳에만 있다** —
          # `docs/k8s-local-verification.md`의 ① 절(실측 여섯 건 포함). 여기에 그
          # 인과를 다시 적지 마라. 여러 곳에서 다시 유도하다 한쪽만 고쳐지는 일이
          # 반복됐다. 배선은 `src/health/deployment-probe.spec.ts`가 고정한다.
          #
          # 두 경로 모두 데이터베이스를 보지 않는다(`src/health/CONTEXT.md`).
          # ---------------------------------------------------------------

          # 기동 확인 프로브. 이것이 통과할 때까지 생존 확인(liveness)과
          # 준비 확인(readiness)은 아예 시작하지 않는다.
          #
          # 막으려는 사고가 분명하다. 이 애플리케이션은 부팅할 때 클러스터
          # 밖의 Supabase에 붙는데(`PrismaService.onModuleInit`의 `$connect`),
          # 네트워크 상황에 따라 그 시간이 늘어날 수 있다. 기동 확인 프로브가
          # 없으면 생존 확인이 먼저 실패해 컨테이너를 재시작시키고, 재시작하면
          # 초기화를 처음부터 다시 하고, 또 느려서 또 재시작되는 고리에 빠진다.
          # 겉으로는 "애플리케이션이 계속 죽는다"로만 보여 원인이 보이지 않는다.
          #
          # 생존 확인 쪽에 `initialDelaySeconds`를 주는 방식은 쓰지 않는다.
          # 이 프로브가 같은 목적을 이미 덮으므로, 둘을 겹쳐 두면 나중에 값을
          # 조정할 때 어느 쪽이 실제로 작동하는지 알 수 없게 된다.
          startupProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            periodSeconds: 2
            # 2초 × 30회 = 최대 60초까지 기동을 기다린다.
            #
            # 이 환경에서 실측한 기동 시간(프로세스 시작부터 포트가 열릴
            # 때까지)은 1초 미만이라 60배 여유다. 양쪽 위험 중 **너무 짧게
            # 잡는 쪽을 더 무겁게 봤다** — 짧으면 위에 적은 무한 재시작
            # 고리가 그대로 생기고 그때는 원인이 보이지 않는다. 반대로 길게
            # 잡아 생기는 손해는 "진짜로 못 뜨는 파드를 늦게 알아차리는 것"
            # 뿐인데, 그 상태도 결국 CrashLoopBackOff로 드러나고 그 사이
            # 준비 확인을 통과하지 못해 요청이 가지도 않는다.
            failureThreshold: 30

          # 준비 확인. 이 결과가 Service의 전달 대상 목록을 결정한다.
          #
          # 주기와 실패 허용 횟수가 **위의 드레인 대기와 짝**이다. 값을 고칠 때
          # 필요한 계산은 이것뿐이다.
          #   판정 최악 (주기 1초 + 시간 초과 1초) × 2회 = 4초
          #   전파 여유                                  2초
          #   ------------------------------------------------
          #   합 6초 < 드레인 8초   ← 이 부등호가 깨지면 가드가 실패한다
          # 실패 허용을 1회로 줄이면 판정은 빨라지지만, 프로브 응답이 한 번
          # 늦어진 것만으로 파드가 트래픽 경로에서 빠진다 — 파드가 하나뿐인
          # 이 구성에서는 그 순간이 전면 장애라 2회로 둔다.
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 2

          # 생존 확인. 실패하면 파드를 **재시작**한다. 준비 확인보다 훨씬
          # 둔감하게 잡는다 — 일시적인 지연으로 멀쩡한 프로세스를 죽이는 것이
          # 잠깐 느린 것보다 비싸기 때문이다.
          #
          # **경로를 `ready`로 바꾸지 마라**(위 배선 규칙). 그 대가가 어느 종료
          # 경로에서 어떻게 나타나는지는 `docs/k8s-local-verification.md` ① 절에
          # 실측과 함께 있다.
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # `lifecycle.preStop`이 없는 것은 의도다 — 근거는 이 파일 맨 위의
          # "종료 절차" 주석에 있다.

          resources:
            # 로컬 검증 기준이다. 요청량(requests)은 스케줄링에, 상한(limits)은
            # 폭주 방지에 쓴다. 메모리 상한을 넘으면 컨테이너는 OOM으로
            # 강제 종료되고 정상 종료 절차를 타지 못하므로 여유를 뒀다.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi

          securityContext:
            # 실행 도중 권한이 올라가는 경로를 막는다
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # 루트 파일시스템을 읽기 전용으로 건다. 침해가 일어나도 이미지에
            # 무언가를 심어 둘 수 없다. 쓰기가 필요한 곳은 아래 /tmp뿐이다.
            readOnlyRootFilesystem: true

          volumeMounts:
            # Node.js와 그 의존성이 임시 파일을 쓸 수 있는 자리를 남긴다.
            # 읽기 전용 루트 파일시스템에서 이것이 없으면, 임시 파일을 쓰는
            # 경로가 하나라도 생기는 날 원인을 알기 어려운 오류로 나타난다.
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          # 파드와 수명을 같이하는 빈 디렉터리. 파드가 사라지면 함께 사라진다
          emptyDir: {}
